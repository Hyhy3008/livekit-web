<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AI Avatar Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 28px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .video-panel {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 4/3;
    }

    audio { display: none; }

    .video-status {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #10b981;
      font-weight: 600;
    }

    .video-status.disconnected { color: #ef4444; }

    .connection-controls {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 10px;
    }

    .chat-panel {
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      font-size: 16px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: #0f172a;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: #3b82f6;
      color: white;
    }

    .message.bot {
      align-self: flex-start;
      background: #334155;
      color: #e2e8f0;
    }

    .message.system {
      align-self: center;
      background: #0f172a;
      color: #94a3b8;
      font-size: 13px;
      border: 1px solid #334155;
    }

    .message-sender {
      font-size: 11px;
      opacity: 0.7;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.5;
    }

    .chat-input-wrapper {
      padding: 16px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    button:hover:not(:disabled) {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button.secondary {
      background: #475569;
    }

    button.secondary:hover:not(:disabled) {
      background: #64748b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
    }

    .log-panel {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px 20px;
      border: 1px solid #334155;
    }

    .log-header {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      opacity: 0.8;
    }

    .log-content {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #94a3b8;
    }

    .tag {
      text-align: center;
      opacity: 0.6;
      font-size: 12px;
      margin-top: 16px;
    }

    /* ✅ Sending indicator */
    .sending-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #334155;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 8px;
    }

    .sending-indicator.active {
      display: flex;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #475569;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .chat-panel {
        height: 500px;
      }

      .connection-controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      h1 { font-size: 22px; margin-bottom: 16px; }
      .video-panel, .chat-panel, .log-panel { padding: 12px; }
      .chat-panel { height: 400px; }
      .connection-controls { grid-template-columns: 1fr; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🤖 AI Avatar Chat</h1>

  <div class="main-grid">
    <div class="video-panel">
      <div class="video-wrapper">
        <video id="v" autoplay playsinline muted></video>
        <div class="video-status disconnected" id="status">Disconnected</div>
      </div>
      <audio id="a" autoplay></audio>

      <div class="connection-controls">
        <input id="room" value="testroom" placeholder="Room name"/>
        <input id="id" value="viewer-1" placeholder="Your name"/>
        <button id="connect">Connect</button>
        <button id="disconnect" class="secondary">Disconnect</button>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-header">💬 Chat</div>
      <div class="chat-messages" id="messages"></div>
      <div class="chat-input-wrapper">
        <input 
          type="text" 
          id="chat" 
          class="chat-input" 
          placeholder="Nhập tin nhắn... (Enter để gửi)"
          autocomplete="off"
        />
        <button id="send">Send</button>
      </div>
      <!-- ✅ Sending indicator -->
      <div class="sending-indicator" id="sending">
        <div class="spinner"></div>
        <span>Sending...</span>
      </div>
    </div>
  </div>

  <div class="log-panel">
    <div class="log-header">🔧 Debug Log</div>
    <div class="log-content" id="log"></div>
  </div>

  <div class="tag">Server: {{ livekit_url }}</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.0.8/dist/livekit-client.umd.min.js"></script>

<script>
let room = null;
let isConnected = false;

const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const messagesEl = document.getElementById("messages");
const v = document.getElementById("v");
const a = document.getElementById("a");
const chatInput = document.getElementById("chat");
const sendBtn = document.getElementById("send");
const connectBtn = document.getElementById("connect");
const disconnectBtn = document.getElementById("disconnect");
const sendingIndicator = document.getElementById("sending");

// ============= LOGGING =============
function log(s) {
  const timestamp = new Date().toLocaleTimeString();
  logEl.textContent += `[${timestamp}] ${s}\n`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log(s); // ✅ Console log for debugging
}

// ============= CHAT UI =============
function addMessage(sender, text, type = 'user') {
  const msg = document.createElement('div');
  msg.className = `message ${type}`;
  
  const senderEl = document.createElement('div');
  senderEl.className = 'message-sender';
  senderEl.textContent = sender;
  
  const textEl = document.createElement('div');
  textEl.className = 'message-text';
  textEl.textContent = text;
  
  msg.appendChild(senderEl);
  msg.appendChild(textEl);
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'message system';
  const textEl = document.createElement('div');
  textEl.className = 'message-text';
  textEl.textContent = text;
  msg.appendChild(textEl);
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ============= CONNECTION =============
connectBtn.onclick = async () => {
  if (typeof LivekitClient === 'undefined') {
    alert('LiveKit SDK not loaded! Please refresh the page.');
    log('❌ SDK not loaded');
    return;
  }

  const roomName = document.getElementById("room").value.trim();
  const identity = document.getElementById("id").value.trim();

  if (!roomName || !identity) {
    alert("Vui lòng nhập room name và identity!");
    return;
  }

  log(`Connecting to: ${roomName} as ${identity}`);
  addSystemMessage(`Connecting to ${roomName}...`);

  try {
    const r = await fetch(`/token?identity=${encodeURIComponent(identity)}&room=${encodeURIComponent(roomName)}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    
    const {token, url} = await r.json();
    log(`Token OK, connecting to: ${url}`);

    room = new LivekitClient.Room({ 
      adaptiveStream: true, 
      dynacast: true 
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      log(`✅ Track: ${track.kind} from ${participant.identity}`);
      if (track.kind === "video") {
        track.attach(v);
        v.muted = true;
      }
      if (track.kind === "audio") {
        track.attach(a);
      }
    });

    room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
      const text = new TextDecoder().decode(payload);
      log(`📩 DATA: ${text.substring(0, 100)}`);
      
      try {
        const data = JSON.parse(text);
        
        if (data.type === "reply") {
          addMessage("AI Avatar", data.text, "bot");
        } else if (data.type === "status") {
          addSystemMessage(`Status: ${data.text}`);
        } else if (data.type === "latency") {
          addSystemMessage(`⚡ Latency: ${data.total}s (render: ${data.render}s)`);
        } else if (data.type === "error") {
          addSystemMessage(`❌ Error: ${data.text}`);
        } else if (data.type === "prebuffer_progress") {
          addSystemMessage(`⏳ Buffering: ${data.have}/${data.need} frames`);
        }
      } catch (e) {
        // Not JSON
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      log('❌ Disconnected');
      isConnected = false;
      statusEl.textContent = "Disconnected";
      statusEl.className = "video-status disconnected";
      connectBtn.disabled = false;
      disconnectBtn.disabled = true;
      sendBtn.disabled = true;
    });

    room.on(LivekitClient.RoomEvent.Connected, () => {
      log('✅ Room connected event');
      isConnected = true;
      sendBtn.disabled = false;
    });

    await room.connect(url, token);
    log("✅ Connected!");
    isConnected = true;
    statusEl.textContent = "Connected";
    statusEl.className = "video-status";
    addSystemMessage("✅ Connected! Start chatting.");
    
    connectBtn.disabled = true;
    disconnectBtn.disabled = false;
    sendBtn.disabled = false;
    chatInput.focus();
    
  } catch (error) {
    log(`❌ Failed: ${error.message}`);
    addSystemMessage(`❌ Failed: ${error.message}`);
    console.error(error);
    isConnected = false;
  }
};

disconnectBtn.onclick = async () => {
  if (room) {
    await room.disconnect();
    room = null;
    isConnected = false;
    log("Disconnected");
    statusEl.textContent = "Disconnected";
    statusEl.className = "video-status disconnected";
    addSystemMessage("Disconnected");
    
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    sendBtn.disabled = true;
  }
};

// ============= ✅ SEND CHAT (FIXED) =============
async function sendChat() {
  log('sendChat() called'); // Debug
  
  // ✅ Simple check
  if (!room) {
    log('❌ No room object');
    alert("Chưa kết nối! Bấm Connect trước.");
    return;
  }

  if (!isConnected) {
    log('❌ Not connected');
    alert("Đang kết nối... vui lòng đợi.");
    return;
  }
  
  const text = chatInput.value.trim();
  if (!text) {
    log('❌ Empty text');
    return;
  }

  log(`Attempting to send: "${text}"`);
  
  // Show sending indicator
  sendingIndicator.classList.add('active');
  sendBtn.disabled = true;
  
  try {
    const msg = JSON.stringify({type: "chat", text});
    const encoded = new TextEncoder().encode(msg);
    
    log(`Publishing data: ${msg.substring(0, 50)}...`);
    
    await room.localParticipant.publishData(encoded, { 
      reliable: true,
      destinationIdentities: [] // Broadcast to all
    });
    
    log(`✅ Sent successfully`);
    addMessage("You", text, "user");
    chatInput.value = "";
    chatInput.focus();
    
  } catch (error) {
    log(`❌ Send error: ${error.message}`);
    console.error('Send error:', error);
    alert(`Failed to send: ${error.message}`);
  } finally {
    sendingIndicator.classList.remove('active');
    sendBtn.disabled = false;
  }
}

// ✅ Button click
sendBtn.onclick = () => {
  log('Send button clicked');
  sendChat();
};

// ✅ Enter key
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault(); // Prevent form submission
    log('Enter pressed');
    sendChat();
  }
});

// Initial state
disconnectBtn.disabled = true;
sendBtn.disabled = true;

// Welcome
addSystemMessage("👋 Welcome! Enter room name and click Connect.");
log('Page loaded, SDK: ' + (typeof LivekitClient !== 'undefined' ? 'OK' : 'FAILED'));

// ✅ Focus on room input
document.getElementById('room').focus();
</script>
</body>
</html>
